<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stiflyt v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="/static/profile.css">
<script src="/static/common.js"></script>
<script src="/static/basemap.js"></script>
<script src="/static/profile.js"></script>
<style>
  :root {
    --ink: #16242e; --muted: #5a6872; --line: #dfe4e8; --wash: #f1f4f6;
    --trail: #d81b60; --path: #1565c0; --road: #8d5524; --osm: #5f7d1e; --heritage: #7b1fa2; --parcel: #455a64;
    --selected: #ffd600; --together: #00796b; --apart: #e65100; --meeting: #37474f;
    --sign: #7a1e2c;  /* what is yours: the colour of a trail sign plate */
    --water: #0277bd; --ice: #00838f;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --tight: "Barlow Semi Condensed", "Barlow", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; font: 15px/1.4 var(--body); color: var(--ink); }
  #side { width: 348px; flex: none; display: flex; flex-direction: column; background: #fff;
          border-right: 1px solid var(--line); overflow: hidden; }
  #mapwrap { flex: 1; min-width: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  #top { position: absolute; top: 12px; left: 12px; right: 56px; z-index: 2; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #undobar { max-width: 72%; display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
  #undobar > button { text-align: left; font: inherit; cursor: pointer; max-width: 100%;
          background: #fff; color: var(--ink); border: 1.5px solid var(--sign); border-radius: 4px; padding: 7px 12px;
          box-shadow: 0 1px 4px #0003; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #undobar > button strong { color: var(--sign); margin-right: 6px; }
  #undobar > button:hover, #undobar > button:focus-visible { background: var(--wash); }
  #undobar > button:disabled { opacity: 0.6; cursor: wait; }
  #unsaved { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fff7dc; border: 1.5px solid #b07d00; border-radius: 4px;
          padding: 4px 6px 4px 12px; box-shadow: 0 1px 4px #0003; }
  #unsaved[hidden] { display: none; }
  #unsaved .count { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: underline dotted; }
  #unsaved .last { color: var(--muted); font-size: 13px; max-width: 26ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #unsaved.new { animation: took 0.9s ease-out; }
  @keyframes took { from { background: #ffd24a; box-shadow: 0 0 0 5px #ffd24a88; } to { background: #fff7dc; box-shadow: 0 1px 4px #0003; } }
  @media (prefers-reduced-motion: reduce) { #unsaved.new { animation: none; } }
  #topsaid { background: #fff; border: 1.5px solid #b00020; border-radius: 4px; padding: 6px 12px; box-shadow: 0 1px 4px #0003; max-width: min(80%, 620px); cursor: pointer; }
  details.how > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.how[open] > summary { margin-bottom: 4px; }
  .said { background: #eef5ee; border-left: 3px solid #3d7a45; padding: 6px 10px; margin: 6px 0; }
  dialog#leave { border: 1.5px solid var(--sign); border-radius: 6px; padding: 16px 18px; max-width: 420px; font: inherit; color: var(--ink); }
  dialog#leave::backdrop { background: #0005; }
  footer details > summary { cursor: pointer; }
  #footwarn { color: #b00020; font-weight: 500; }
  #latest { flex-basis: 100%; max-width: 440px; max-height: 60vh; overflow: auto; background: #fff; border: 1.5px solid var(--sign);
          border-radius: 4px; box-shadow: 0 2px 8px #0004; padding: 10px 12px; }
  #latest h2 { margin: 0 0 2px; font-size: 15px; }
  #latest ol { list-style: none; margin: 8px 0 0; padding: 0; }
  #latest li { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
  #latest li .when { color: var(--muted); font-size: 13px; }
  #latest li .sub { grid-column: 2 / -1; }
  #mode { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); z-index: 2; max-width: 80%;
          background: var(--sign); color: #fff; padding: 8px 14px; border-radius: 4px; font-weight: 500; }
  #mode button { margin-left: 10px; }
  #hint { max-width: min(80%, 620px);
          background: var(--sign); color: #fff; padding: 8px 14px; border-radius: 4px; font-weight: 500; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 20px/1.1 var(--tight); margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px; }
  h1 a { color: inherit; text-decoration: none; }
  h1 .where { font: 400 13px var(--body); color: var(--muted); }
  h1 a.home { margin-left: auto; font: 500 13px var(--body); color: var(--path); text-decoration: underline; }
  h2 { font: 600 15px/1.3 var(--body); margin: 0 0 6px; }
  h2.next { margin-top: 14px; }
  input[type=search], input[type=text], select { width: 100%; padding: 7px 9px; font: inherit; color: inherit;
          border: 1px solid #b4bec6; border-radius: 4px; background: #fff; }
  :focus-visible { outline: 2px solid var(--path); outline-offset: 1px; }
  #scroll { flex: 1; overflow-y: auto; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .backbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 6px; margin: -12px -16px 10px;
             padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .backbar .grow { flex: 1; }
  li.hit.last { box-shadow: inset 3px 0 0 var(--sign); }
  ul { list-style: none; margin: 0; padding: 0; }
  li.hit { padding: 5px 6px; margin: 0 -6px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  li.hit:hover, li.hit:focus-visible { background: var(--wash); }
  li.hit.current { background: #fff6cc; }
  .code { font: 600 15px var(--tight); min-width: 46px; }
  .sub { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { color: var(--muted); font: 500 14px var(--tight); white-space: nowrap; font-variant-numeric: tabular-nums; }
  label.layer { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .swatch { width: 22px; height: 0; border-top: 3px solid; flex: none; }
  .swatch.dash { border-top-style: dashed; }
  .swatch.box { height: 12px; border: 2px solid; opacity: .8; }
  .swatch.dot { width: 10px; height: 10px; border: 0; border-radius: 50%; margin: 0 6px; }
  .swatch.ring { width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; margin: 0 5px; box-shadow: 0 0 0 1px #0004; }
  .zoomnote { color: var(--muted); font: 13px var(--tight); margin-left: auto; white-space: nowrap; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 6px 0; }
  dt { color: var(--muted); } dd { margin: 0; }
  .bar { height: 8px; border-radius: 4px; background: #e3e8ee; overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; background: var(--path); }
  .empty { color: var(--muted); padding: 4px 0; }
  .error { color: #a3231b; font-weight: 500; }
  .tag { font: 500 13px var(--tight); padding: 0 7px; border-radius: 9px; background: #fde8d8; color: #a23b00; white-space: nowrap; }
  .tag.ok { background: #dcefeb; color: #00574d; }
  .tag.yours { background: var(--sign); color: #fff; }
  .tag.none { background: #e6eaed; color: #44525c; }
  .filter { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
  .filter button { font: 500 13px var(--tight); padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .filter button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  #routelist { max-height: 46vh; overflow: auto; margin: 0 -6px; padding: 0 6px; }
  details { margin-top: 8px; } summary { cursor: pointer; font-weight: 600; padding: 3px 0; }
  /* The place being edited is shown as the sign that would name it. */
  .plate { background: var(--sign); color: #fff; padding: 11px 14px 12px 30px; margin: 0 -4px 10px -16px;
           clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%); }
  .plate .name { font: 600 24px/1.1 var(--tight); overflow-wrap: anywhere; }
  .plate .kind { font-size: 13px; opacity: .88; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button.btn { font: 500 14px var(--body); color: var(--ink); background: #fff; border: 1px solid #b4bec6;
               border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button.btn:hover { background: var(--wash); }
  button.btn.main { background: var(--sign); border-color: var(--sign); color: #fff; }
  button.btn.main:hover { background: #631723; }
  button.btn.quiet { border-color: transparent; color: var(--muted); padding: 4px 4px; text-decoration: underline; }
  li.point { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 0; border-top: 1px solid var(--line); }
  li.point .routes { font: 500 14px var(--tight); }
  ol.log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  ol.log li { display: grid; grid-template-columns: 86px 1fr; gap: 8px; padding: 2px 0; color: var(--muted); }
  ol.log li span:last-child { color: var(--ink); }
  footer { padding: 9px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  /* The areas side by side: a sheet over the map, since a table of twelve columns does not fit the side. */
  #report { position: absolute; inset: 0; z-index: 4; background: #fff; overflow: auto; padding: 22px 28px 40px; }
  #report header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 0; border: 0; margin-bottom: 4px; }
  #report h2 { font: 600 24px/1.15 var(--tight); margin: 0; }
  #report select { width: auto; max-width: 26em; }
  #report p { margin: 4px 0 16px; max-width: 46em; color: var(--muted); }
  #report table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #report th, #report td { padding: 5px 12px; text-align: right; white-space: nowrap; }
  #report thead th { font: 500 13px/1.25 var(--tight); color: var(--muted); vertical-align: bottom; position: sticky; top: -22px; background: #fff; }
  #report thead tr:first-child th { font: 600 14px var(--tight); color: var(--ink); text-align: left; border-bottom: 2px solid var(--ink); }
  #report tbody th { text-align: left; font: 600 15px var(--tight); }
  #report tbody tr { border-top: 1px solid var(--line); cursor: pointer; }
  #report tbody tr:hover, #report tbody tr:focus-visible { background: var(--wash); outline: none; }
  #report td.first, #report th.first { border-left: 1px solid var(--line); padding-left: 16px; }
  #report td.strong { font-weight: 600; }
  #report td.none { color: #a9b3ba; }
  #report tfoot td, #report tfoot th { border-top: 2px solid var(--ink); font-weight: 600; text-align: right; }
  #report tfoot th { text-align: left; font: 600 15px var(--tight); }
  #tell textarea { width: 100%; font: inherit; color: var(--ink); padding: 6px 8px; border: 1px solid var(--line);
                   border-radius: 6px; resize: vertical; margin-top: 6px; }
  .maplibregl-popup-content { font: 14px/1.4 var(--body); max-width: 300px; padding: 10px 28px 10px 12px; border-radius: 4px; }
  .pop h3 { margin: 8px 0 2px; font: 600 13px var(--body); color: var(--muted); }
  .pop h3:first-child { margin-top: 0; }
  .pop a, button.link { color: var(--path); background: none; border: 0; padding: 0; font: inherit;
          cursor: pointer; text-decoration: underline; }
  button.clear { float: right; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; max-height: 48vh; border-right: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1><a href="/" title="To the front page: the areas, the routes and the signs">Stiflyt v2</a><span class="where">Route editor</span><a class="home" href="/">‹ Front page</a></h1>
    <input id="q" type="search" placeholder="Search place or route (e.g. Arentzbu, bre18)" autocomplete="off">
  </header>
  <div id="scroll">
    <section id="results" hidden></section>
    <section id="place" hidden></section>
    <section id="selected" hidden></section>
    <section id="bylist">
      <h2>Routes by area</h2>
      <select id="who" aria-label="Whose routes to show"><option value="">Everybody's routes</option></select>
      <select id="area" style="margin-top:6px"><option value="">Choose an area prefix…</option></select>
      <div style="margin-top:6px"><button class="link" id="openreport">Every area side by side</button></div>
      <ul id="arearoutes"></ul>
    </section>
    <section>
      <details id="legend"><summary>Layers, and what the colours mean</summary>
      <div id="layers"></div>
      <div class="sub" style="margin-top:8px">The base map (grey, colour, OpenStreetMap) is chosen with the layers button at the top right of the map.</div>
    </details>
    </section>
  </div>
  <footer><div id="others" role="status"></div><details id="foot"><summary><span id="footwho">Loading…</span><span id="footwarn"></span></summary><div id="editing"></div><div id="nightly" class="error" role="status"></div><div id="tell"></div><div><a href="guide" target="_blank" rel="noopener">How to use this</a> <a href="/" style="margin-left:10px">Front page: areas, routes and signs</a></div><div id="status">Loading…</div></details></footer>
</div>
<div id="mapwrap"><div id="map"></div>
  <section id="report" hidden aria-labelledby="reporttitle"></section>
  <div id="top"><div id="undobar">
    <button id="undo" hidden title="Takes your latest change in the map back, whatever it was. What others have changed since stays. Ctrl or Cmd with Z does the same."></button>
    <button id="redo" hidden title="Brings back what you took back last. Ctrl or Cmd with Shift and Z does the same. Once you change something else, that stands in its place."></button>
    <button id="morelatest" hidden aria-expanded="false" aria-controls="latest" title="Your latest changes in the map: go back to before any of them in one go."><strong>Latest changes</strong></button>
    <div id="unsaved" hidden role="status"></div><!-- after the buttons: they stay where they are when it comes and goes -->
    <section id="latest" hidden aria-label="Your latest changes"></section>
  </div><div id="hint" hidden role="status"></div><div id="topsaid" class="error" hidden role="alert" title="Click to put it away"></div></div>
  <dialog id="leave"></dialog>
  <div id="mode" hidden role="status"></div></div>

<script>
"use strict";
const C = { trail: css("--trail"), path: css("--path"), road: css("--road"), heritage: css("--heritage"),
            parcel: css("--parcel"), selected: css("--selected"), together: css("--together"),
            apart: css("--apart"), meeting: css("--meeting"), sign: css("--sign"), osm: css("--osm"),
            water: css("--water"), ice: css("--ice") };
const GONE = "#7a8691", IN_USE = ["!=", ["get", "discontinued"], true];    // a discontinued route is drawn apart
// A fault in this page is told to the server, where what the tool refuses is kept too. Each fault
// once, and not what the server has itself answered or a lost connection.
const toldFaults = new Set();
function tellFault(message, trace) {
  try {
    message = String(message || "a fault in the page").slice(0, 2000);
    if (!EDITOR || toldFaults.size >= 10 || toldFaults.has(message)
        || /^[45]\d\d |Failed to fetch|NetworkError|Load failed/.test(message)) return;
    toldFaults.add(message);
    send("POST", "feedback", { kind: "failed", what: "page", message, trace: trace ? String(trace).slice(0, 8000) : null,
                               context: whereNow() }).catch(() => {});
  } catch {}
}
window.addEventListener("error", e => tellFault(e.message, e.error && e.error.stack));
window.addEventListener("unhandledrejection", e => tellFault(e.reason && e.reason.message || e.reason, e.reason && e.reason.stack));

const vector = (layer, minzoom) => ({
  type: "vector", minzoom, maxzoom: 15, tiles: [`${API}tiles/${layer}/{z}/{x}/{y}.mvt`],
  attribution: layer === "heritage" ? "© Riksantikvaren" : layer === "osm" ? "© OpenStreetMap contributors" : "© Kartverket",
});
const width = (a, b) => ["interpolate", ["linear"], ["zoom"], 8, a, 15, b];

const map = new maplibregl.Map({
  container: "map", hash: true, center: [7.5, 61.7], zoom: 9, maxZoom: 18,
  style: {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      ...baseSources(),
      trails: vector("trails", 7), paths: vector("paths", 11), roads: vector("roads", 11), osm: vector("osm", 11), info_points: vector("info_points", 10),
      heritage: vector("heritage", 12), parcels: vector("parcels", 13),
      anchors: vector("anchors", 8), meetings: vector("meetings", 11), end_links: vector("end_links", 12),
      selected: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      owned: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      ownedroutes: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      findings: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      draft: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      held: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
      corners: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      ...baseLayers(),
      { id: "parcels", type: "line", source: "parcels", "source-layer": "parcels",
        paint: { "line-color": C.parcel, "line-width": 0.8, "line-opacity": 0.7 } },
      { id: "heritage-fill", type: "fill", source: "heritage", "source-layer": "heritage",
        filter: ["!=", ["get", "kind"], "sikringssone"],
        paint: { "fill-color": C.heritage, "fill-opacity": 0.3 } },
      { id: "heritage-line", type: "line", source: "heritage", "source-layer": "heritage",
        filter: ["!=", ["get", "kind"], "sikringssone"],
        paint: { "line-color": C.heritage, "line-width": 1.2 } },
      { id: "heritage-zone", type: "line", source: "heritage", "source-layer": "heritage",
        filter: ["==", ["get", "kind"], "sikringssone"],
        paint: { "line-color": C.heritage, "line-width": 1, "line-dasharray": [2, 2] } },
      { id: "selected-halo", type: "line", source: "selected",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": C.selected, "line-width": width(9, 16), "line-opacity": 0.75 } },
      // The route is a wide translucent band and the mapped path a thin line on
      // top of it, so that where the two coincide both can still be seen.
      { id: "trails-water", type: "line", source: "trails", "source-layer": "trails",
        filter: ["==", ["get", "water"], true],
        paint: { "line-color": C.water, "line-width": width(1.5, 3), "line-opacity": 0.8, "line-dasharray": [0.6, 1.6] } },
      { id: "trails-unmarked", type: "line", source: "trails", "source-layer": "trails",
        filter: ["all", ["!=", ["get", "marked"], true], ["!=", ["get", "water"], true]],
        paint: { "line-color": C.trail, "line-width": width(1.5, 5), "line-opacity": 0.7,
                 "line-dasharray": [2, 1.5] } },
      { id: "trails-marked", type: "line", source: "trails", "source-layer": "trails",
        filter: ["==", ["get", "marked"], true], layout: { "line-cap": "round" },
        paint: { "line-color": C.trail, "line-width": width(1.5, 5), "line-opacity": 0.7 } },
      // OpenStreetMap, to compare with: off until switched on. Not something the routes are laid on.
      { id: "osm-roads", type: "line", source: "osm", "source-layer": "osm", filter: ["!=", ["get", "on_foot"], true],
        layout: { "line-cap": "round", visibility: "none" },
        paint: { "line-color": C.osm, "line-width": width(0.8, 1.8), "line-opacity": 0.75, "line-dasharray": [3, 1] } },
      { id: "osm-paths", type: "line", source: "osm", "source-layer": "osm", filter: ["==", ["get", "on_foot"], true],
        layout: { "line-cap": "round", visibility: "none" },
        paint: { "line-color": C.osm, "line-width": width(1, 2.2) } },
      { id: "roads", type: "line", source: "roads", "source-layer": "roads",
        layout: { "line-cap": "round" },
        paint: { "line-color": C.road, "line-width": width(0.8, 1.8), "line-dasharray": [3, 1] } },
      { id: "paths", type: "line", source: "paths", "source-layer": "paths",
        layout: { "line-cap": "round" },
        paint: { "line-color": ["match", ["get", "kind"], "traktorveg", C.road, C.path],
                 "line-width": width(0.8, 1.8) } },
      { id: "info_points", type: "circle", source: "info_points", "source-layer": "info_points",
        paint: { "circle-radius": 3.5, "circle-color": "#ffffff", "circle-stroke-color": C.trail,
                 "circle-stroke-width": 1.5 } },
      // Where routes end: a line from each end to the anchor it belongs to.
      { id: "end_links", type: "line", source: "end_links", "source-layer": "end_links",
        paint: { "line-color": C.apart, "line-width": 1.6 } },
      { id: "meetings", type: "circle", source: "meetings", "source-layer": "meetings",
        paint: { "circle-radius": ["case", ["==", ["get", "kind"], "junction"], 3.5, 4.5],
                 "circle-color": ["case", [">", ["get", "spots"], 1], C.apart,
                                  ["==", ["get", "kind"], "junction"], C.meeting, "#ffffff"],
                 "circle-stroke-color": ["case", ["==", ["get", "kind"], "junction"], "#ffffff", C.meeting],

    const at = items.filter(i => i.routes.some(r => r.id === route.id));
    if (at.length && othersAt.isConnected) othersAt.replaceChildren(...at.map(i => el("div", { class: "said", style: "border-left-color:#b07d00;background:#fff7dc" },
      `${i.author}${i.through === "mcp" ? " (through an assistant)" : i.through === "api" ? " (through a script)" : ""} has ${countOf(i.changes)} to this route that ${i.changes === 1 ? "is" : "are"} not saved yet.`)));
  }).catch(() => {});
  const done = async () => {
    try { await send("POST", `owned/routes/${route.id}/review`, { version: route.version }); await send("POST", "work/save"); clearRoute(); await refreshOwned(); refreshEditing(); refreshArea(); }
    catch (err) { renderOwnedRoute(route, err.message); }
  };
  selected.replaceChildren(
    backBar(route.code),
    el("h2", {}, "Your route"),
    D ? el("div", { style: "margin-bottom:6px" }, el("span", { class: "tag none" }, "discontinued"),
      el("span", { class: "sub" }, ` since ${new Date(D.since).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}: ${D.why.replace(/[.\s]+$/, "")}. Kept here, with its history. `),
      can ? el("button", { class: "link", onclick: () => { discForm.hidden = false; whyInput.focus(); } }, "Change") : "", can ? " " : "",
      can ? el("button", { class: "link", onclick: () => change(() => send("DELETE", `owned/routes/${route.id}/discontinued?version=${route.version}`)) }, "In use after all") : "") : "",
    U ? el("div", { style: "margin-bottom:6px" }, el("span", { class: "tag none" }, "not published"),
      el("span", { class: "sub" }, `: ${U.why.replace(/[.\s]+$/, "")}. Kept here, and left out of what is handed to UT.no${route.sources.length ? "; Kartverket is asked to take its number off" : ""}. `),
      can ? el("button", { class: "link", onclick: () => unpublish(U.why) }, "Change") : "", can ? " " : "",
      can ? el("button", { class: "link", onclick: () => change(() => send("DELETE", `owned/routes/${route.id}/unpublished?version=${route.version}`)) }, "Publish it after all") : "") : "",
    el("div", {}, el("span", { class: "code", style: "font-size:19px" }, route.code), " ", name,
      route.code_provisional ? el("div", {}, el("span", { class: "tag" }, "temporary code"), el("span", { class: "sub" }, " until a real one is assigned")) : "",
      route.reviewed ? "" : el("div", { class: "sub" }, "Not done yet: nobody has said it is right.")),
    route.reviewed ? el("div", {}, el("span", { class: "tag yours" }, "done"), el("span", { class: "sub" }, " You have said this route is right. "),
      can ? el("button", { class: "link", onclick: () => change(() => send("POST", `owned/routes/${route.id}/review`, { version: route.version, done: false })) }, "Not done after all") : "") : "",
    problem ? el("div", { class: "error", role: "alert" }, `That change was not saved: ${problem}`) : "",
    note ? el("div", { class: "said", role: "status" }, note) : "",
    othersAt,
    tools,
    can ? el("div", { class: "actions" },
      !route.reviewed ? el("button", { class: "btn main", title: "Says the route is right as it is now, saves what you have changed, and closes it", onclick: done }, "Done with this route") : "",
      el("button", { class: "btn", title: "Its name, code, who maintains it, its grading and its description", onclick: () => { edit.hidden = false; codeInput.focus(); codeInput.select(); } }, "Change name, code, grading…")) : "",
    edit, hands,
    route.description ? el("p", { style: "margin:8px 0;white-space:pre-wrap" }, route.description) : "",
    facts, profile, mapped,
    el("h2", { class: "next" }, "Shape"), el("div", {}, shape),
    gaps.length ? el("ul", {}, ...gaps) : "", ends, unnamed, more,
    can ? el("div", { class: "actions" },
      el("button", { class: "btn", title: "Reads what UT.no says about the route from its page there. Nothing is changed until you take it.", onclick: () => (route.utno_id ? fromUtno() : askUtno()) }, "Fetch the description from UT.no")) : "",
    utnoBox,
    el("h2", { class: "next" }, "History"),
    el("ol", { class: "log" }, ...route.history.map(e => el("li", {},
      el("span", {}, new Date(e.at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })),
      el("span", {}, (ROUTE_EVENT[e.type] || (() => e.type))(e.payload), el("span", { class: "sub" }, `, ${e.author}`))))),
    can ? el("div", { class: "actions" }, el("button", { class: "btn", title: "Take back the changes to this route and its line, as far back as you choose. What was done to other routes in between stays.", onclick: showBack }, "Put it back as it was…")) : "",
    backBox,
    el("div", { class: "actions", style: "margin-top:12px" },
      el("button", { class: "btn", onclick: () => { if (route.bbox) map.fitBounds([[route.bbox[0], route.bbox[1]], [route.bbox[2], route.bbox[3]]], { padding: 60, maxZoom: 15, animate: !calm }); } }, "Show on map"),
      el("button", { class: "btn", onclick: () => beforeLeaving(clearRoute) }, can && !route.reviewed ? "Close, not done" : "Close")),
    // What ends a route, or takes it out of sight: kept apart from closing its panel.
    can ? el("details", { class: "how", style: "margin-top:10px", open: route.length.legs ? false : "" }, el("summary", {}, "Discontinued, not to be published, or withdrawn…"),
      el("div", { class: "actions" },
        !D && route.length.legs ? el("button", { class: "btn", title: "Given up in the terrain, and kept here with its history", onclick: () => { discForm.hidden = false; whyInput.focus(); } }, "It is discontinued") : "",
        !U && route.length.legs ? el("button", { class: "btn", title: "Kept here, and not shown to the public", onclick: () => unpublish(null) }, "It is not to be published") : "",
        el("button", { class: route.length.legs ? "btn" : "btn main", title: "Takes the route out of what is yours. Undo brings it back.", onclick: () => withdrawRoute(route) }, "Withdraw route"))) : "",
    discForm);
  selected.scrollIntoView({ block: "nearest" });
}

const asked = new URLSearchParams(location.search);
if (asked.get("route")) selectRoute(asked.get("route"));
// One of your routes, as the front page links to it. Who is editing is asked first, so that it opens to be changed.
if (asked.get("yours")) refreshEditing().then(() => openOwnedRoute(asked.get("yours"), true));
if (asked.get("q")) { document.getElementById("q").value = asked.get("q"); search(asked.get("q")); }

get("status").then(rows => {
  const newest = rows.map(r => r.built_at).sort().pop();
  document.getElementById("status").textContent = rows.length
    ? `Index built ${newest.slice(0, 16).replace("T", " ")} UTC.`
    : "The index has not been built.";
}).catch(err => { document.getElementById("status").textContent = `No contact with the API: ${err.message}`; });
</script>
</body>
</html>
