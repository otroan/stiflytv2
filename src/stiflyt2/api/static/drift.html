<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stiflyt v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">

<body>
<div id="side">
  <header>
    <div class="top"><svg class="tstone" width="32" height="30" viewBox="0 0 32 30" aria-hidden="true"><path d="M3.6 10.2C4.8 4.9 9.9 2.4 16 2.6c6.6.2 11.5 2.5 12.6 8.1 1 5.1.4 10.4-2.6 14.2-2.8 3.5-7.6 4.6-12.3 4.2-5-.4-8.9-2.4-10.4-6.6C2 18.8 2.8 14.3 3.6 10.2z" fill="#ebe7de"/><path d="M3.6 10.2C4.8 4.9 9.9 2.4 16 2.6c6.6.2 11.5 2.5 12.6 8.1" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1"/><path d="M8.4 8.9c5-.6 10-.7 15-.1l-.2 4.3c-1.6-.1-3.2-.1-4.8-.1l.3 10.6-4.7.1-.2-10.6c-1.8 0-3.5.1-5.2.3z" fill="#d3161b"/></svg><h1>Stiflyt <small>v2</small></h1><div id="season"></div><a class="away" href="/ruter" title="The route editor: where the routes are changed, their lines, places and what is said about them">Route editor ›</a></div>
    <div class="partsrow">
      <nav aria-label="Parts of Stiflyt"><a id="tab-routes" href="/">Routes</a><a id="tab-signs" href="/?view=signs">Signs</a><a id="tab-plan" href="/?view=planner" hidden>Plan</a></nav>
      <div class="search"><input id="search" type="search" placeholder="Search  /" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-found"
        aria-label="Search for a route by its code, its name or a place it passes, an area, or a place" title="A route by its code, its name or a place it passes; an area; a place anywhere in Norway. Press / to come here.">
        <ul id="search-found" role="listbox" hidden></ul></div>
    </div>
    <nav id="lenses" class="lenses" aria-label="What of the routes is shown" hidden><a id="lens-routes" href="/">Overview</a><a id="tab-issues" href="/?view=issues" hidden>Issues</a><a id="tab-reports" href="/?view=reports" hidden>Reports</a><a id="tab-photos" href="/?view=photos" hidden>Photos</a><a id="tab-tracks" href="/?view=tracks" hidden title="GPX tracks walked on the routes">Tracks</a><a id="tab-landowners" href="/?view=landowners" hidden title="Who owns the ground">Owners</a></nav>
    <nav id="plans" class="lenses" aria-label="What is planned" hidden><a id="tab-planner" href="/?view=planner" hidden title="A walk from anywhere to anywhere in Norway">A walk</a><a id="tab-trips" href="/?view=trips" hidden title="A trip for work that covers routes of an area">A work trip</a></nav>
  </header>
  <div id="scroll"><section id="panel"><div class="sub">Loading…</div></section></div>
  <div id="undo" hidden></div>
  <dialog id="leave"></dialog>
  <dialog id="photo" aria-label="A photo"></dialog>
  <div id="chosen" hidden role="status"></div>
  <div id="present" hidden role="status"></div>
  <footer id="who"></footer>
</div>
<div id="mapwrap"><div id="map"></div><div id="hint" hidden role="status"></div>
  <button id="basket" class="none" aria-expanded="false" aria-controls="basketbox" title="The order: the signs chosen to be made">
    <svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M1 6.5h18l-2 10H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 6.5L8.5 1M14 6.5L11.5 1M7.5 9.5v4M10 9.5v4M12.5 9.5v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span class="n" id="basketcount">0</span></button>
  <div id="basketbox" hidden role="region" aria-label="The order"></div></div>

<script src="/static/front/start.js"></script>
</body>
</html>
