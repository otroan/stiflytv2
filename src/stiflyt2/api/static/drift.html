<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stiflyt v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="/static/profile.css">
<script src="/static/basemap.js"></script>
<script src="/static/profile.js"></script>
<style>
  :root {
    --ink: #16242e; --muted: #5a6872; --line: #dfe4e8; --wash: #f1f4f6; --path: #1565c0; --ice: #00838f;
    --sign: #7a1e2c;        /* a route of ours, and what is decided */
    --wood: #cdc8bc; --wood-edge: #9a9486; --green: #114232; --t: #d3161b;     /* a sign is weathered wood, or green (RAL 6005) */
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --tight: "Barlow Semi Condensed", "Barlow", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; font: 15px/1.4 var(--body); color: var(--ink); }
  #side { width: 372px; flex: none; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); overflow: hidden; }
  #mapwrap { flex: 1; min-width: 0; position: relative; }
  #map { position: absolute; inset: 0; }
  #hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 2; max-width: 80%;
          background: var(--sign); color: #fff; padding: 8px 14px; border-radius: 4px; font-weight: 500; }
  #hint button { margin-left: 10px; }
  /* The order, as a basket at the top right of the map: how many signs are in it, and the way to take it out. */
  #basket { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; align-items: center; gap: 7px; padding: 6px 10px 6px 9px;
            background: #fff; color: var(--ink); border: 0; border-radius: 4px; box-shadow: 0 0 0 2px #0000001a; font: 600 15px var(--tight); cursor: pointer; }
  #basket:hover { background: var(--wash); }
  #basket .n { min-width: 22px; padding: 0 6px; border-radius: 11px; background: var(--sign); color: #fff; font-size: 13px; line-height: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  #basket.none .n { background: #b9c1c7; }
  #basketbox { position: absolute; top: 10px; right: 96px; z-index: 3; width: 330px; max-width: calc(100% - 106px); max-height: 70vh; overflow: auto;
               background: #fff; border-radius: 6px; box-shadow: 0 2px 14px #0005; padding: 12px 14px; }
  #basketbox h2 { margin: 0 0 6px; }
  body[data-view=signs] #mapwrap .maplibregl-ctrl-top-right { top: 46px; }
  /* The order and the signs chosen for it belong to the signs: among the routes they are out of the way. */
  body:not([data-view=signs]) #basket, body:not([data-view=signs]) #basketbox, body:not([data-view=signs]) #chosen { display: none; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 20px/1.1 var(--tight); margin: 0; }
  nav { display: flex; gap: 14px; margin-top: 8px; font: 500 15px var(--tight); }
  nav a { color: var(--muted); text-decoration: none; padding-bottom: 2px; }
  nav a[aria-current] { color: var(--ink); border-bottom: 2px solid var(--sign); }
  nav a.away { margin-left: auto; }
  h2 { font: 600 15px/1.3 var(--body); margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  input[type=text], input[type=number], select, textarea { width: 100%; padding: 6px 8px; font: inherit; color: inherit;
          border: 1px solid #b4bec6; border-radius: 4px; background: #fff; }
  textarea { resize: vertical; }
  :focus-visible { outline: 2px solid var(--path); outline-offset: 1px; }
  #scroll { flex: 1; overflow-y: auto; }
  section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  footer { padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.hit { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; margin: 0 -6px; border-radius: 4px; cursor: pointer; }
  li.hit:hover, li.hit:focus-visible { background: var(--wash); }
  .grow { flex: 1; min-width: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .error { color: #a3231b; font-weight: 500; }
  .tag { font: 500 13px var(--tight); padding: 0 7px; border-radius: 9px; background: #e6eaed; color: #44525c; white-space: nowrap; }
  .tag.warn { background: #fde8d8; color: #a23b00; }
  .filter { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
  .filter button { font: 500 13px var(--tight); padding: 3px 9px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .filter button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button.btn { font: inherit; padding: 5px 11px; border: 1px solid #b4bec6; border-radius: 4px; background: #fff; color: var(--ink); cursor: pointer; }
  button.btn:hover { background: var(--wash); }
  button.btn.main { background: var(--sign); border-color: var(--sign); color: #fff; }
  button.btn[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }
  button.link, a { color: var(--path); }
  a.btn { display: inline-block; font: inherit; padding: 5px 11px; border: 1px solid #b4bec6; border-radius: 4px; background: #fff; color: var(--ink); text-decoration: none; }
  a.btn:hover { background: var(--wash); }
  button.link { background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }
  .backbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; margin: -12px -16px 10px;
             padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  label.field { display: block; margin-top: 8px; color: var(--muted); font-size: 13px; }
  /* An area and a route, in numbers. */
  h2.area { font: 600 24px/1.1 var(--tight); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
  h2 .code { font: 600 17px var(--tight); margin-right: 8px; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 10px 0 12px; }
  dl.facts dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
  dl.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .grade { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; flex: none; }
  .grade.G { background: #2e7d32; } .grade.B { background: #1565c0; } .grade.R { background: #c62828; } .grade.S { background: #17191a; }
  .grade.none { background: #fff; box-shadow: inset 0 0 0 1.5px #9aa5ad; }
  .graded { display: inline-flex; align-items: baseline; margin-right: 10px; white-space: nowrap; }
  li.hit .code { font: 600 14px var(--tight); min-width: 50px; }
  li.hit .far { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  li.hit.area .code { font-size: 16px; text-transform: uppercase; letter-spacing: .03em; }
  .said { white-space: pre-wrap; overflow-wrap: anywhere; }
  .seen { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .maplibregl-popup-content { font: 15px/1.4 var(--body); padding: 10px 14px; }
  /* A sign as it hangs. In the mountains a plank of weathered wood: the red T in its ring at the end the
     arrow is at, a small black arrow, the name. Green as the sign manual has it: arrow, distance, name,
     and the walker at the far end. A sign that points right is the same, turned round. */
  .post { margin: 12px 0 4px; padding-left: 12px; border-left: 4px solid #6b5a43; }
  .post.out { opacity: .55; }
  .post h3 { font: 600 14px var(--tight); margin: 0 0 6px; }
  .plate { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 36px; margin: 5px 0; padding: 5px 9px; border: 0; cursor: pointer;
           text-align: left; font: italic 500 16px/1.2 var(--body); color: #17191a; border-radius: 1px;
           background: repeating-linear-gradient(178deg, #0000 0 5px, #0000000d 5px 6px), linear-gradient(var(--wood), #c2bcae);
           box-shadow: inset 0 0 0 1px var(--wood-edge), 0 1px 2px #0002; }
  .plate.høyre { flex-direction: row-reverse; text-align: right; }
  .plate svg { flex: none; }
  .plate .name { overflow-wrap: anywhere; }
  .plate .km { white-space: nowrap; font-style: normal; font-size: 14px; font-variant-numeric: tabular-nums; }
  .plate.grønn { background: var(--green); color: #fff; font: 600 16px/1.2 var(--tight); border-radius: 5px; box-shadow: 0 1px 2px #0003; }
  .plate.grønn .name { flex: 1; }
  .plate.top { justify-content: center; min-height: 40px; }
  .plate.top svg { margin-right: auto; }
  .plate.top .name { margin-right: auto; padding-right: 24px; }
  .plate[aria-pressed=true] { outline: 3px solid var(--path); outline-offset: 2px; }
  .plate.hot { box-shadow: inset 0 0 0 1px var(--wood-edge), 0 0 0 3px #f5c400; }
  .plate.grønn.hot { box-shadow: 0 0 0 3px #f5c400; }
  #find { margin-top: 8px; }
  .backbar .step { padding: 5px 9px; }
  .plate.out { opacity: .45; }
  #chosen { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--ink); color: #fff; font-weight: 500; }
  #chosen .grow { flex: 1; }
  #chosen button.btn.main { background: #fff; border-color: #fff; color: var(--ink); }
  #chosen button.btn { background: none; border-color: #fff8; color: #fff; }
  .plate.out .name { text-decoration: line-through; }
  .plate:focus-visible { outline-offset: 3px; }
  .below { margin: 0 0 8px; }
  form.edit { margin: 2px 0 10px; padding: 8px 10px; background: var(--wash); border-radius: 4px; }
  form.edit .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stake { width: 20px; height: 20px; border-radius: 3px; background: #6b5a43; color: #fff; border: 2px solid #fff; box-shadow: 0 0 0 1px #3c3226; cursor: grab;
           font: 700 12px/16px var(--tight); text-align: center; }
  .stake.assumed { background: #fff; color: #3c3226; border-color: #6b5a43; }
  .stake.fixed { cursor: default; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; max-height: 52vh; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="side">
  <header>
    <h1>Stiflyt v2</h1>
    <nav aria-label="Parts of Stiflyt"><a id="tab-routes" href="/">Routes</a><a id="tab-signs" href="/?view=signs">Signs</a><a class="away" href="/ruter" title="Where the routes are changed: their lines, places and what is said about them">Route editor</a></nav>
  </header>
  <div id="scroll"><section id="panel"><div class="sub">Loading…</div></section></div>
  <div id="chosen" hidden role="status"></div>
  <footer id="who"></footer>
</div>
<div id="mapwrap"><div id="map"></div><div id="hint" hidden role="status"></div>
  <button id="basket" class="none" aria-expanded="false" aria-controls="basketbox" title="The order: the signs chosen to be made">
    <svg width="20" height="18" viewBox="0 0 20 18" aria-hidden="true"><path d="M1 6.5h18l-2 10H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 6.5L8.5 1M14 6.5L11.5 1M7.5 9.5v4M10 9.5v4M12.5 9.5v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span class="n" id="basketcount">0</span></button>
  <div id="basketbox" hidden role="region" aria-label="The order"></div></div>

<script>
const API = new URL("api/v1/", location.origin + "/").href;
// Text from the data is always inserted as text, never as HTML.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  }
  for (const child of children) if (child !== null && child !== undefined) node.append(child);
  return node;
}
const THROUGH = { "X-Stiflyt-Through": "viewer" };
let leaving = false;
function signIn() { if (!leaving) { leaving = true; location.href = new URL(`auth/login?next=${encodeURIComponent(location.pathname)}`, API).href; } }
async function get(path, params = {}) {
  const url = new URL(path, API);
  for (const [k, v] of Object.entries(params)) if (v !== null && v !== undefined) url.searchParams.set(k, v);
  const r = await fetch(url, { headers: THROUGH });
  if (r.status === 401) signIn();
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
async function send(method, path, body) {
  const r = await fetch(new URL(path, API), { method, headers: { ...(body ? { "Content-Type": "application/json" } : {}), ...THROUGH }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) signIn();
  if (!r.ok) {
    let message = `${r.status} ${r.statusText}`;
    try { const d = (await r.json()).detail; message = typeof d === "string" ? d : JSON.stringify(d); } catch {}
    throw new Error(message);
  }
  return r.status === 204 ? null : r.json();
}
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const kmText = km => km === null ? "" : `${km < 10 ? km.toFixed(1).replace(".", ",") : Math.round(km)} km`;      // as a sign says it
const count = n => `${n} ${n === 1 ? "sign" : "signs"}`;
const km = v => `${v.toLocaleString("en", { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km`;       // a length walked
function svg(tag, attrs = {}, ...children) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  for (const child of children) if (child !== null && child !== undefined) node.append(child);
  return node;
}
// What is on a sign beside its words: the T in its ring, the arrow, and for a green sign the walker.
const tMark = () => svg("svg", { width: 24, height: 24, viewBox: "0 0 24 24", "aria-hidden": "true" },
  svg("circle", { cx: 12, cy: 12, r: 10.5, fill: "none", stroke: "#5d6166", "stroke-width": 1.2, "stroke-dasharray": "1.6 1.3" }),
  svg("path", { d: "M6.5 6.5h11v3.6h-3.6V18h-3.8v-7.9H6.5z", fill: css("--t") }));
const arrowMark = (direction, colour) => svg("svg", { width: 13, height: 13, viewBox: "0 0 12 12", "aria-hidden": "true" },
  svg("path", { d: { venstre: "M11 1L1 6l10 5z", "høyre": "M1 1l10 5L1 11z", "rett fram": "M1 11L6 1l5 10z" }[direction] || "", fill: colour }));
const walkerMark = () => svg("svg", { width: 22, height: 22, viewBox: "0 0 22 22", "aria-hidden": "true" },
  svg("rect", { x: 1, y: 1, width: 20, height: 20, rx: 2.5, fill: "#fff" }),
  svg("circle", { cx: 12, cy: 5.3, r: 2, fill: css("--green") }),
  svg("path", { d: "M11.5 8.2l-3 2.6v3.2M11.5 8.2l.6 4.8 2.6 2v3.6M12 13l-2.2 2.4-1.6 3.2M12 9.6l3.4 1.6", fill: "none", stroke: css("--green"), "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round" }));
const empty = { type: "FeatureCollection", features: [] };

const map = new maplibregl.Map({
  container: "map", hash: true, center: [7.6, 61.7], zoom: 9, maxZoom: 19,
  style: {
    version: 8, glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      ...baseSources(),
      routes: { type: "geojson", data: empty }, sites: { type: "geojson", data: empty }, rays: { type: "geojson", data: empty },
      places: { type: "geojson", data: empty },
    },
    layers: [
      ...baseLayers(),
      { id: "route-hot", type: "line", source: "routes", filter: ["in", "|none|", ["get", "ids"]], layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#f5c400", "line-width": 9 } },
      { id: "routes", type: "line", source: "routes", paint: { "line-color": css("--sign"), "line-width": ["interpolate", ["linear"], ["zoom"], 8, 1.2, 15, 3], "line-opacity": 0.75 } },
      { id: "route-open", type: "line", source: "routes", filter: ["in", "|none|", ["get", "ids"]], layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": css("--sign"), "line-width": ["interpolate", ["linear"], ["zoom"], 8, 3.5, 15, 6] } },
      { id: "places", type: "circle", source: "places", minzoom: 10, paint: { "circle-radius": 3, "circle-color": "#fff", "circle-stroke-color": css("--ink"), "circle-stroke-width": 1.5 } },
      { id: "place-names", type: "symbol", source: "places", minzoom: 12,
        layout: { "text-field": ["get", "name"], "text-font": ["Open Sans Semibold"], "text-size": 11, "text-offset": [0, 1], "text-anchor": "top" },
        paint: { "text-color": css("--muted"), "text-halo-color": "#fff", "text-halo-width": 1.5 } },
      { id: "rays-hot", type: "line", source: "rays", filter: ["==", ["get", "hot"], true], paint: { "line-color": "#f5c400", "line-width": 9 } },
      { id: "rays", type: "line", source: "rays", paint: { "line-color": css("--ink"), "line-width": 3 } },
      { id: "ray-text", type: "symbol", source: "rays", minzoom: 15,
        layout: { "symbol-placement": "line-center", "text-field": ["get", "text"], "text-font": ["Open Sans Semibold"], "text-size": 12, "text-offset": [0, -0.9], "text-allow-overlap": true },
        paint: { "text-halo-color": "#fff", "text-halo-width": 2 } },
      { id: "sites-small", type: "circle", source: "sites", minzoom: 10, layout: { visibility: "none" },
        paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 2.5, 15, 5], "circle-color": "#fff", "circle-stroke-color": css("--sign"), "circle-stroke-width": 1.5 } },
      { id: "sites", type: "circle", source: "sites",
        paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 4, 14, 8],
                 // What is going on at a site: signs on the order, signs ordered and not up yet, or no signs there at all.
                 "circle-color": ["match", ["get", "state"], "order", "#e65100", "waiting", "#00796b", "none", "#b9c1c7", "#fff"],
                 "circle-stroke-color": ["case", ["get", "open"], css("--ink"), css("--sign")], "circle-stroke-width": ["case", ["get", "open"], 3.5, 2] } },
      { id: "site-names", type: "symbol", source: "sites", minzoom: 10,
        layout: { "text-field": ["get", "name"], "text-font": ["Open Sans Semibold"], "text-size": 12, "text-offset": [0, 1.2], "text-anchor": "top" },
        paint: { "text-halo-color": "#fff", "text-halo-width": 1.5 } },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
map.addControl(new BaseControl(), "top-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-right");
// What is drawn waits for the map's style once. After that it is drawn at once, also while the map is busy with something else.
let styled = false;
const waiting_for_style = [];
map.once("load", () => { styled = true; for (const draw of waiting_for_style.splice(0)) draw(); });
const whenLoaded = draw => { if (styled) draw(); else waiting_for_style.push(draw); };
function go(center, zoom) {
  const to = { center, zoom: Math.max(map.getZoom(), zoom) };
  if (calm) map.jumpTo(to); else map.flyTo(to);
}

let me = { operates: false }, areas = [], area = null, found = null, shown = "all", open = null, problem = null;
let view = "routes";             // what the side shows of the area: its routes, or its signs
let route = null;                // the code of the route that is open, among the routes
let over = null;                 // the area as a whole: its routes, and what they add up to
let overProblem = null, foundProblem = null;
let lines = null;                // every stretch of the routes in use, as the map draws them
let seek = "";                   // what is typed to find a route
let shownRoute = null;           // the open route as it was fetched: { id, detail, height, problem }
let several = null;              // the box on the map that asks which of several routes at a spot
let stakes = [], placing = null, editing = null;
const chosen = new Set();        // the signs clicked, to be added to the order together
let sought = "";                 // what is typed to find a site
let hot = null;                  // the post and the way a sign points that the pointer is at: { post, bearing }
let drawn = [];                  // the lines on the map that say which way the signs of the open site point
const panel = document.getElementById("panel"), hint = document.getElementById("hint");
// A site with no name is told by its routes, and by what it lies near, where something near has a name.
const siteLabel = s => s.name || `${s.free ? "On" : "Junction of"} ${s.routes.join(", ")}${s.near ? `, by ${s.near.name}` : ""}`;

function drawMap() {
  whenLoaded(() => {
    // Among the routes the sign sites are small points to click; among the signs they say what is going on at each.
    const among = view === "routes";
    map.setLayoutProperty("sites", "visibility", among ? "none" : "visible");
    map.setLayoutProperty("site-names", "visibility", among ? "none" : "visible");
    map.setLayoutProperty("sites-small", "visibility", among ? "visible" : "none");
    // The routes of the area stand out; those of other areas are there to be seen past.
    map.setPaintProperty("routes", "line-opacity", area ? ["case", ["in", `|${area}|`, ["get", "areas"]], 0.8, 0.25] : 0.75);
    const walked = among && route && over && over.routes.find(r => r.code === route);
    map.setFilter("route-open", ["in", `|${walked ? walked.id : "none"}|`, ["get", "ids"]]);

    areas = await get("owned/areas");
    const drawn = get("owned/routes.geojson").then(all => { lines = inUse(all); whenLoaded(() => map.getSource("routes").setData(lines)); }).catch(() => {});
    get("places.geojson").then(all => whenLoaded(() => map.getSource("places").setData({ type: "FeatureCollection", features: all.features.filter(f => f.properties.type === "place") }))).catch(() => {});
    // The address says where to start. With none, the area last looked at; with no such, the areas.
    const at = here();
    if (!new URLSearchParams(location.search).has("area")) at.area = localStorage.getItem("stiflyt2.area") || localStorage.getItem("stiflyt2.signs.area");
    await Promise.all([arrive(at, false), drawn]);
    if (!location.hash) fit();
  } catch (err) { panel.replaceChildren(el("div", { class: "error" }, `No contact with the server: ${err.message}`)); }
})();
</script>
</body>
</html>
