#
# How GDAL reads OpenStreetMap for stiflyt2 (the adapter `osm`): every way with
# a highway tag as a line, with all its tags as JSON, and nothing left out.
# Made from GDAL's own osmconf.ini; only the lines are read.
#

# A closed way is a line here, as OpenStreetMap has it: a footway round a square, a
# platform. (A way tagged area=yes is still an area to GDAL, and is not read.)
closed_ways_are_polygons=building

# Tags that GDAL would otherwise drop early (created_by, source, note, ...) are kept.
report_all_tags=yes

tags_format=json

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=highway
ignore=
all_tags=yes

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no
