#
# How GDAL reads OpenStreetMap for the route planner's network (`ops/walknet.py`):
# glaciers and huts. Made from GDAL's own osmconf.ini; only points and areas are read.
#

# A closed way is an area when it is a glacier, a hut or a building.
closed_ways_are_polygons=natural,tourism,building

report_all_tags=no

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,tourism,operator
other_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no

[multipolygons]
osm_id=yes
osm_way_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,natural,tourism,operator
other_tags=no

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=
other_tags=no
