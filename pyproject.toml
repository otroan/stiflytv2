[project]
name = "stiflyt2"
version = "0.1.0"
description = "Stiflyt v2: owned hiking route dataset with immutable source imports"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stiflyt2 = "stiflyt2.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stiflyt2"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
